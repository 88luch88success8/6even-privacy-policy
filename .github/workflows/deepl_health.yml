name: DeepL Health Check

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  check-deepl:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: Тестируем ответ DeepL
        run: |
          set -e
          ENDPOINT=$(jq -r '.endpoint' deepl_rules.json)
          USER_AGENT=$(jq -r '.userAgent' deepl_rules.json)
          ORIGIN=$(jq -r '.extraHeaders.Origin // "https://www.deepl.com"' deepl_rules.json)
          MODE=$(jq -r '.protocolMode // "jobs"' deepl_rules.json)
          
          echo "Тестируем endpoint: $ENDPOINT (режим: $MODE)..."
          
          if [ "$MODE" = "oneshot" ]; then
            PAYLOAD='{"text":["Hello world"],"target_lang":"ru"}'
          else
            NOW_MS=$(date +%s%3N)
            TS=$(( NOW_MS - (NOW_MS % 1) + 1 ))
            PAYLOAD="{\"jsonrpc\":\"2.0\",\"method\":\"LMT_handle_texts\",\"params\":{\"texts\":[{\"text\":\"Hello\",\"requestAlternatives\":0}],\"splitting\":\"newlines\",\"lang\":{\"source_lang_user_selected\":\"EN\",\"target_lang\":\"RU\"},\"timestamp\":$TS,\"commonJobParams\":{\"wasSpoken\":false,\"transcribe_as\":\"\"}},\"id\":83920199}"
          fi
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$ENDPOINT" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "User-Agent: $USER_AGENT" \
            -H "Origin: $ORIGIN" \
            -d "$PAYLOAD")
          
          BODY=$(echo "$RESPONSE" | sed '$d')
          CODE=$(echo "$RESPONSE" | tail -n1)
          
          echo "HTTP Код ответа: $CODE"
          echo "Тело ответа: $BODY"
          
          if [ "$CODE" -ne 200 ]; then
            echo "::error::DeepL вернул HTTP код $CODE"
            exit 1
          fi
          
          if echo "$BODY" | grep -qi -E "older version of deepl|старую версию deepl|update to the latest version|slow down please"; then
            echo "::error::ОБНАРУЖЕН БАННЕР УСТАРЕВАНИЯ!"
            exit 1
          fi
          
          echo "УСПЕХ: DeepL перевел текст штатно!"
