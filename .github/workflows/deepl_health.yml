name: DeepL Health Check

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  check-deepl:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: Тестируем ответ DeepL
        run: |
          set -e
          
          PAYLOAD_B64=$(jq -r '.payload // empty' deepl_rules.json)
          if [ -n "$PAYLOAD_B64" ]; then
            CONFIG_JSON=$(python3 -c "
import base64
raw = base64.b64decode('$PAYLOAD_B64')
key = b'6evenkey6888'
dec = bytes([raw[i] ^ key[i % len(key)] for i in range(len(raw))]).decode('utf-8')
print(dec)
")
          else
            CONFIG_JSON=$(cat deepl_rules.json)
          fi
          
          ENDPOINT=$(echo "$CONFIG_JSON" | jq -r '.endpoint')
          USER_AGENT=$(echo "$CONFIG_JSON" | jq -r '.userAgent')
          ORIGIN=$(echo "$CONFIG_JSON" | jq -r '.extraHeaders.Origin // "https://www.deepl.com"')
          MODE=$(echo "$CONFIG_JSON" | jq -r '.protocolMode // "jobs"')
          
          echo "Тестируем endpoint: $ENDPOINT (режим: $MODE)..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$ENDPOINT" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "User-Agent: $USER_AGENT" \
            -H "Origin: $ORIGIN" \
            -d '{"text":["Hello world"],"target_lang":"ru"}')
          
          BODY=$(echo "$RESPONSE" | sed '$d')
          CODE=$(echo "$RESPONSE" | tail -n1)
          
          echo "HTTP Код ответа: $CODE"
          echo "Ответ DeepL: $BODY"
          
          if [ "$CODE" -ne 200 ]; then
            echo "::error::DeepL вернул HTTP код $CODE"
            exit 1
          fi
          
          echo "УСПЕХ: Зашифрованный конфиг успешно расшифрован и проверен!"
