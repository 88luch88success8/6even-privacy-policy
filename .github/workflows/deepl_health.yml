name: DeepL & Translation Engines Health Check

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    paths:
      - 'deepl_rules.json'
      - '.github/workflows/check_engine.yml'
  workflow_dispatch:

jobs:
  check-engines:
    name: Test DeepL Web & Fallback Engines
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Engine Health Probe
        id: probe
        run: |
          python - << 'EOF'
          import json
          import os
          import sys
          import time
          import urllib.request
          import urllib.parse
          import urllib.error

          print("=== 6even Screen Translator: DeepL Web Verification ===")

          rules_path = "deepl_rules.json"
          if not os.path.exists(rules_path):
              print(f"::error::Файл {rules_path} не найден!")
              sys.exit(1)

          with open(rules_path, "r", encoding="utf-8") as f:
              config = json.load(f)

          version = config.get("version", 5)
          endpoint = config.get("endpoint", "https://oneshot-free.www.deepl.com/v1/translate")
          protocol_mode = config.get("protocolMode", "oneshot")
          user_agent = config.get("userAgent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")
          extra_headers = config.get("extraHeaders", {})

          test_phrase = "Hello, world! 6even Screen Translator engine check."
          target_lang = "ru"

          # Формирование запроса под активный протокол oneshot
          if protocol_mode == "oneshot":
              payload_bytes = json.dumps({
                  "text": [test_phrase],
                  "target_lang": target_lang.lower()
              }, ensure_ascii=False).encode("utf-8")
          else:
              payload_bytes = json.dumps({
                  "jsonrpc": "2.0",
                  "method": config.get("rpcMethod", "LMT_handle_texts"),
                  "params": {
                      "texts": [{"text": test_phrase, "requestAlternatives": 0}],
                      "splitting": "newlines",
                      "lang": {"target_lang": target_lang.upper(), "source_lang_user_selected": "auto"},
                      "timestamp": int(time.time() * 1000)
                  },
                  "id": 12345678
              }, ensure_ascii=False).encode("utf-8")

          headers = {
              "Content-Type": "application/json; charset=utf-8",
              "Accept": "*/*",
              "User-Agent": user_agent
          }
          headers.update(extra_headers)

          deepl_ok = False
          deepl_text = ""
          deepl_status = "UNKNOWN"
          latency = 0

          t0 = time.time()
          try:
              req = urllib.request.Request(endpoint, data=payload_bytes, headers=headers, method="POST")
              with urllib.request.urlopen(req, timeout=10) as resp:
                  latency = int((time.time() - t0) * 1000)
                  body = resp.read().decode("utf-8")
                  data = json.loads(body)

                  if "translations" in data and len(data["translations"]) > 0:
                      deepl_text = data["translations"][0].get("text", "").strip()
                  elif "result" in data and "texts" in data["result"]:
                      deepl_text = data["result"]["texts"][0].get("text", "").strip()

                  if deepl_text:
                      deepl_ok = True
                      deepl_status = f"OPERATIONAL ({resp.status} OK)"
                      print(f"[SUCCESS] DeepL Web перевел за {latency}ms: '{deepl_text}'")
                  else:
                      deepl_status = "EMPTY_RESULT"
          except urllib.error.HTTPError as e:
              latency = int((time.time() - t0) * 1000)
              deepl_status = f"HTTP {e.code}"
              print(f"::error::DeepL вернул ошибку {e.code}")
          except Exception as e:
              deepl_status = f"ERROR: {str(e)}"
              print(f"::error::Сетевая ошибка DeepL: {e}")

          # Проверка Google Web Fallback
          google_ok = False
          google_text = ""
          google_latency = 0
          try:
              t1 = time.time()
              g_url = f"https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q={urllib.parse.quote(test_phrase)}"
              with urllib.request.urlopen(urllib.request.Request(g_url, headers={"User-Agent": user_agent}), timeout=5) as g_resp:
                  google_latency = int((time.time() - t1) * 1000)
                  g_data = json.loads(g_resp.read().decode("utf-8"))
                  google_text = g_data[0][0][0]
                  google_ok = True
          except Exception:
              pass

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as s:
                  s.write("## 🌐 6even Screen Translator: Engine Health Report\n\n")
                  s.write(f"**Версия правил (`deepl_rules.json`):** `v{version}` (`mode: {protocol_mode}`)\n\n")
                  s.write("| Движок перевода | Статус | Задержка | Результат перевода |\n")
                  s.write("| :--- | :---: | :---: | :--- |\n")
                  deepl_badge = "🟢 Работает" if deepl_ok else "🔴 Ошибка"
                  s.write(f"| **DeepL Web (`{protocol_mode}`)** | {deepl_badge} ({deepl_status}) | `{latency} ms` | {deepl_text or '—'} |\n")
                  google_badge = "🟢 Работает" if google_ok else "🔴 Ошибка"
                  s.write(f"| **Google Web (Fallback)** | {google_badge} | `{google_latency} ms` | {google_text or '—'} |\n\n")

          if not deepl_ok:
              sys.exit(1)
          EOF
